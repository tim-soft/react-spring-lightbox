name: Tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn lint:eslint
            - run: yarn lint:prettier
            # Vitest doesn't type-check, so tsc checks the tests along with the source
            - run: yarn lint:ts

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn test
            # Uploads even when coverage misses a threshold, so Codecov shows the
            # uncovered lines. Errors never fail this required job. Fork PRs
            # upload without a token, and Dependabot PRs need CODECOV_TOKEN as a
            # Dependabot secret.
            - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              if: ${{ !cancelled() }}
              with:
                  disable_search: true
                  fail_ci_if_error: false
                  files: coverage/unit/lcov.info
                  flags: unit
                  token: ${{ secrets.CODECOV_TOKEN }}

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: npx playwright install --with-deps chromium firefox webkit
            - run: yarn test:e2e
              env:
                  # Records the library lines Chromium runs, in coverage/e2e
                  E2E_COVERAGE: true
            - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              if: ${{ !cancelled() }}
              with:
                  disable_search: true
                  fail_ci_if_error: false
                  files: coverage/e2e/lcov.info
                  flags: e2e
                  token: ${{ secrets.CODECOV_TOKEN }}
            - uses: actions/upload-artifact@v7
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
